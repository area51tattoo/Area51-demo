function clientName(id){let c=state.clients.find(x=>x.id===id);return c?`${c.first} ${c.last}`:'Cliente'}
function artist(id){return state.artists.find(x=>x.id===id)}
function station(id){return state.stations.find(x=>x.id===id)}
function doLogin(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPassword').value;let u=state.users.find(x=>x.email.toLowerCase()===e&&x.password===p);if(!u){document.getElementById('loginError').textContent='Credenziali non valide.';return}session={userId:u.id};saveSession();showApp()}
function startAs(role){let u=state.users.find(x=>x.role===role);if(!u){state=seed();save();u=state.users.find(x=>x.role===role)}session={userId:u.id};saveSession();document.getElementById('loginError').textContent='';showApp()}
function switchRole(role){let u=state.users.find(x=>x.role===role);if(!u)return;session={userId:u.id};saveSession();closeModal();showApp()}
function logout(){session=null;saveSession();closeModal();document.getElementById('app').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('loginPassword').value='';document.getElementById('loginError').textContent=''}

function showApp(){if(!currentUser()){logout();return}document.getElementById('loginScreen').classList.add('hidden');let app=document.getElementById('app');app.classList.remove('hidden');app.classList.toggle('manager',!isOwner());renderNav();updateProfileUI();navigate(route?.page&&route.page!=='admin'?'calendar':'calendar')}
function updateProfileUI(){let u=currentUser();if(!u)return;document.getElementById('topProfileName').textContent=u.name;document.getElementById('topProfileRole').textContent=isOwner()?'Titolare':'Shop Manager';document.getElementById('roleChip').innerHTML=`<b>${u.name}</b><br>${isOwner()?'Titolare · finanze abilitate':'Shop Manager · finanze protette'}`}
function navAction(item){return item.owner&&!isOwner()?`showOwnerLock('${item.label}')`:`navigate('${item.id}')`}
function renderNav(){let n=document.getElementById('nav');n.innerHTML=NAV.map(x=>`<button class="${x.owner&&!isOwner()?'locked':''}" data-page="${x.id}" onclick="${navAction(x)}">${x.icon}&nbsp;&nbsp;${x.label}</button>`).join('');let m=document.getElementById('mobileNav');let items=[['home','⌂','Home'],['calendar','▦','Calendario'],['clients','◎','Clienti'],['inventory','▤','Inventario'],['more','•••','Altro']];m.innerHTML=items.map(x=>`<button data-page="${x[0]}" onclick="${x[0]==='more'?'openMore()':`navigate('${x[0]}')`}"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('');updateProfileUI()}
function setActiveNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===route.page))}
function navigate(page,opts={}){route.page=page;Object.assign(route,opts);setActiveNav();render()}
function render(){setActiveNav();let titles={calendar:'Calendario',home:'Home',clients:'Clienti',client:'Scheda cliente',projects:'Progetti',consents:'Consensi',inventory:'Inventario',shop:'Aftercare & Shop',crm:'CRM',stats:'Statistiche',artists:'Artisti',admin:'Amministrazione'};let subs={calendar:'Agenda studio',home:'Oggi in AREA51',clients:'Anagrafiche e storico',client:'Profilo cliente',projects:'Lavori e sedute',consents:'Documenti e firme',inventory:'Scorte e materiali',shop:'Aftercare e prodotti',crm:'Follow-up clienti',stats:'Andamento operativo',artists:'Team e disponibilità',admin:'Solo titolare'};document.getElementById('pageTitle').textContent=titles[route.page]||'AREA51';document.getElementById('pageSub').textContent=subs[route.page]||'AREA51';let c=document.getElementById('content');let fn={calendar:renderCalendar,home:renderHome,clients:renderClients,client:renderClient,projects:renderProjects,consents:renderConsents,inventory:renderInventory,shop:renderShop,crm:renderCRM,stats:renderStats,artists:renderArtists,admin:renderAdmin}[route.page];c.innerHTML=fn?fn():`<div class=card>Sezione non disponibile.</div>`;wireAfterRender();updateAlerts()}
function wireAfterRender(){}
function upcomingToday(){let d=route.anchor||'2026-08-24';return state.appointments.filter(a=>a.start.slice(0,10)===d).sort((a,b)=>a.start.localeCompare(b.start))}
function renderHome(){let d='2026-08-24',apps=state.appointments.filter(a=>a.start.slice(0,10)===d).sort((a,b)=>a.start.localeCompare(b.start));let confirmed=apps.filter(a=>a.status==='confirmed').length;let missing=apps.filter(a=>!state.consents.some(c=>c.clientId===a.clientId&&c.status==='signed')).length;let finance=isOwner()?`<div class=card><h3>Incassi oggi</h3><div class=metric>${fmtMoney(dayPayments(d))}</div></div>`:`<div class="card locked-card" onclick="showOwnerLock('Incassi')"><div class=lock-title>🔒 Incassi</div><div class=sub>Visibili solo al titolare</div></div>`;return `<div class=screen-intro>Le informazioni che servono per lavorare oggi, senza cercarle nei menu.</div><div class=cards><div class=card><h3>Appuntamenti</h3><div class=metric>${apps.length}</div><div class=sub>oggi</div></div><div class=card><h3>Da completare</h3><div class=metric>${confirmed}</div></div><div class=card><h3>Consensi mancanti</h3><div class=metric>${missing}</div></div>${finance}</div><div class=section-title><h2>Agenda di oggi</h2><div class=spacer></div><button class="btn primary" onclick="openAppointmentModal('${d}','10:00')">+ Appuntamento</button></div><div class=list>${apps.map(appointmentRow).join('')||'<div class=card>Nessun appuntamento.</div>'}</div>`}
function appointmentRow(a){let ar=artist(a.artistId),st=station(a.stationId);let action=a.status==='confirmed'?`<button class="btn good" onclick="event.stopPropagation();openComplete('${a.id}')">Completa</button><button class="btn danger" onclick="event.stopPropagation();openCancel('${a.id}')">Annulla</button>`:`<span class="badge ${a.status==='completed'?'good':'red'}">${a.status==='completed'?'COMPLETATO':'ANNULLATO'}</span>`;return `<div class="row clickable" onclick="openAppointmentDetail('${a.id}')"><div class=avatar style="border:2px solid ${ar?.color||'#555'}">${fmtTime(a.start)}</div><div class=grow><div class=title>${clientName(a.clientId)}</div><div class="muted small">${a.service} · ${ar?.name||'—'} · ${st?.name||'Nessuna postazione'} · ${durationText(durationMinutes(a.start,a.end))}</div></div>${action}</div>`}
function renderCalendar(){let a=route.anchor||'2026-08-24';return `<div class=toolbar><div class=seg><button class="${route.calendarView==='day'?'active':''}" onclick="route.calendarView='day';render()">Giorno</button><button class="${route.calendarView==='week'?'active':''}" onclick="route.calendarView='week';render()">Settimana</button><button class="${route.calendarView==='month'?'active':''}" onclick="route.calendarView='month';render()">Mese</button></div><button class=btn onclick="calendarPrev()">‹</button><button class=btn onclick="route.anchor='2026-08-24';render()">Oggi</button><button class=btn onclick="calendarNext()">›</button><div class=spacer></div><button class=btn onclick="navigate('artists')">Artisti</button><button class="btn primary" onclick="openAppointmentModal('${a}','10:00')">+ Nuovo</button></div>${route.calendarView==='week'?weekView(a):route.calendarView==='day'?dayView(a):monthView(a)}`}
function calendarPrev(){route.anchor=addDays(route.anchor,route.calendarView==='month'?-30:route.calendarView==='week'?-7:-1);render()}
function calendarNext(){route.anchor=addDays(route.anchor,route.calendarView==='month'?30:route.calendarView==='week'?7:1);render()}
function weekView(anchor){let mon=mondayOf(anchor),days=Array.from({length:6},(_,i)=>addDays(mon,i)),html='<div class=calendar-wrap><div class=week-grid>';html+=`<div class=week-head style="grid-column:1;grid-row:1">ORA</div>`;days.forEach((d,i)=>{html+=`<div class="week-head ${d==='2026-08-24'?'today':''} ${isDayFull(d)?'full':''}" style="grid-column:${i+2};grid-row:1" onclick="route.anchor='${d}';route.calendarView='day';render()">${fmtDate(d).replace(',','')} ${isDayFull(d)?'· PIENO':''}</div>`});for(let s=0;s<24;s++){let hh=8+Math.floor(s/2),mm=s%2?'30':'00',row=s+2;html+=`<div class=time-label style="grid-column:1;grid-row:${row}">${String(hh).padStart(2,'0')}:${mm}</div>`;days.forEach((d,i)=>{html+=`<div class=slot style="grid-column:${i+2};grid-row:${row}" onclick="openAppointmentModal('${d}','${String(hh).padStart(2,'0')}:${mm}')"></div>`})}state.appointments.filter(a=>days.includes(a.start.slice(0,10))&&a.status!=='cancelled').forEach(a=>{let d=a.start.slice(0,10),col=days.indexOf(d)+2,start=new Date(a.start),mins=(start.getHours()-8)*60+start.getMinutes(),row=Math.floor(mins/30)+2,span=Math.max(1,Math.ceil(durationMinutes(a.start,a.end)/30)),ar=artist(a.artistId);html+=`<div class=event style="grid-column:${col};grid-row:${row}/span ${span};background:${ar?.color||'#555'}" onclick="openAppointmentDetail('${a.id}')"><strong>${clientName(a.clientId)}</strong><span>${fmtTime(a.start)}–${fmtTime(a.end)} · ${a.service}</span></div>`});return html+'</div></div>'}
function dayView(date){let apps=state.appointments.filter(a=>a.start.slice(0,10)===date&&a.status!=='cancelled');let html=`<div class=section-title><h2>${fmtDate(date)}</h2><div class=spacer></div><button class="btn primary" onclick="openAppointmentModal('${date}','10:00')">+ Appuntamento</button></div><div class=calendar-wrap><div class=day-grid>`;for(let s=0;s<24;s++){let hh=8+Math.floor(s/2),mm=s%2?'30':'00',row=s+1;html+=`<div class=time-label style="grid-column:1;grid-row:${row}">${String(hh).padStart(2,'0')}:${mm}</div><div class=slot style="grid-column:2;grid-row:${row}" onclick="openAppointmentModal('${date}','${String(hh).padStart(2,'0')}:${mm}')"></div>`}apps.forEach(a=>{let start=new Date(a.start),mins=(start.getHours()-8)*60+start.getMinutes(),row=Math.floor(mins/30)+1,span=Math.max(1,Math.ceil(durationMinutes(a.start,a.end)/30)),ar=artist(a.artistId);html+=`<div class=event style="grid-column:2;grid-row:${row}/span ${span};background:${ar?.color||'#555'}" onclick="openAppointmentDetail('${a.id}')"><strong>${clientName(a.clientId)}</strong><span>${fmtTime(a.start)}–${fmtTime(a.end)} · ${a.service}</span></div>`});return html+'</div></div><div class=section-title><h2>Appuntamenti del giorno</h2></div><div class=list>'+apps.map(appointmentRow).join('')+'</div>'}
function monthView(anchor){let d=localDate(anchor),year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1,12),start=new Date(first);let offset=(first.getDay()+6)%7;start.setDate(first.getDate()-offset);let html='<div class=month-grid>';for(let i=0;i<42;i++){let cur=new Date(start);cur.setDate(start.getDate()+i);let ds=isoDate(cur),inMonth=cur.getMonth()===month,apps=state.appointments.filter(a=>a.start.slice(0,10)===ds&&a.status!=='cancelled').slice(0,3);html+=`<div class="month-day ${!inMonth?'empty':''} ${isDayFull(ds)?'full':''}" onclick="route.anchor='${ds}';route.calendarView='day';render()"><div class=month-num>${cur.getDate()} ${isDayFull(ds)?'· PIENO':''}</div><div class=month-events>${apps.map(a=>`<div class=month-ev style="background:${artist(a.artistId)?.color||'#555'}">${fmtTime(a.start)} ${clientName(a.clientId)}</div>`).join('')}</div></div>`}return html+'</div>'}
function isDayFull(date){let slots=Array.from({length:16},(_,i)=>10*60+i*30);return slots.every(min=>{let t1=new Date(localDate(date));t1.setHours(Math.floor(min/60),min%60,0,0);let t2=new Date(t1.getTime()+30*60000);let occupied=new Set(state.appointments.filter(a=>a.status!=='cancelled'&&a.stationId&&a.start.slice(0,10)===date&&overlap(a.start,a.end,t1,t2)).map(a=>a.stationId));return occupied.size>=state.stations.filter(s=>s.active).length})}
function renderClients(){return `<div class=toolbar><input id=clientSearch placeholder="Cerca nome, telefono, email" oninput="filterClients(this.value)" style="flex:1;background:#0e0e10;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px"><button class="btn primary" onclick="openClientModal()">+ Nuovo cliente</button></div><div id=clientList class=list>${clientRows(state.clients)}</div>`}
function clientRows(list){return list.map(c=>`<div class="row clickable" onclick="navigate('client',{clientId:'${c.id}'})"><div class=avatar>${c.first[0]}${c.last[0]}</div><div class=grow><div class=title>${c.first} ${c.last}</div><div class="muted small">${c.phone} · ${c.email||'—'}</div></div><span class=badge>${state.appointments.filter(a=>a.clientId===c.id).length} appuntamenti</span></div>`).join('')}

function renderClient(){let c=state.clients.find(x=>x.id===route.clientId);if(!c)return'<div class=card>Cliente non trovato.</div>';let apps=state.appointments.filter(a=>a.clientId===c.id).sort((a,b)=>b.start.localeCompare(a.start)),projs=state.projects.filter(p=>p.clientId===c.id),cons=state.consents.filter(x=>x.clientId===c.id),pay=isOwner()?state.payments.filter(p=>p.clientId===c.id&&p.status!=='void'):[];return `<div class=section-title><button class=btn onclick="navigate('clients')">‹ Clienti</button><h2>${c.first} ${c.last}</h2><div class=spacer></div><button class=btn onclick="openClientModal('${c.id}')">Modifica</button></div><div class=grid2><div class=card><h3>Anagrafica</h3><div class=detail-kv><div>Telefono</div><div>${c.phone}</div><div>Email</div><div>${c.email||'—'}</div><div>Nascita</div><div>${c.birth||'—'}</div><div>WhatsApp</div><div>${c.whatsapp?'Consentito':'No'}</div><div>Marketing</div><div>${c.marketing?'Consentito':'No'}</div><div>Note</div><div>${c.notes||'—'}</div></div></div><div class=card><h3>Riepilogo operativo</h3><div class=metric>${apps.length}</div><div class=sub>appuntamenti totali</div><div class=statusline><span class=badge>${projs.length} progetti</span><span class=badge>${cons.filter(x=>x.status==='signed').length} consensi firmati</span></div>${isOwner()?`<div class=owner-finance style="margin-top:14px"><div class=sub>Incassi cliente</div><div class=metric>${fmtMoney(pay.reduce((s,p)=>s+Number(p.amount||0),0))}</div></div>`:''}</div></div><div class=section-title><h2>Appuntamenti</h2><div class=spacer></div><button class="btn primary" onclick="openAppointmentModal('2026-08-24','10:00','${c.id}')">+ Appuntamento</button></div><div class=list>${apps.map(appointmentRow).join('')||'<div class=card>Nessun appuntamento.</div>'}</div><div class=section-title><h2>Progetti</h2><div class=spacer></div><button class=btn onclick="openProjectModal('${c.id}')">+ Progetto</button></div><div class=list>${projs.map(p=>`<div class=row><div class=grow><div class=title>${p.title}</div><div class="muted small">${p.style||''} · ${p.status}</div></div>${isOwner()?`<span class="badge gold">${fmtMoney(p.price)}</span>`:''}</div>`).join('')||'<div class=card>Nessun progetto.</div>'}</div>${isOwner()?`<div class=section-title owner-finance><h2>Transazioni</h2></div><div class="list owner-finance">${pay.map(p=>`<div class=row><div class=grow><div class=title>${fmtMoney(p.amount)} · ${p.method}</div><div class="muted small">${p.date} · ${p.status}</div></div><button class=btn onclick="openPaymentEdit('${p.id}')">Modifica</button><button class="btn danger" onclick="voidPayment('${p.id}')">Annulla</button></div>`).join('')||'<div class=card>Nessuna transazione.</div>'}</div>`:''}`}
function renderProjects(){return `<div class=section-title><h2>Progetti tattoo</h2><div class=spacer></div><button class="btn primary" onclick="openProjectModal()">+ Progetto</button></div><div class=list>${state.projects.map(p=>`<div class=row><div class=grow><div class=title>${p.title}</div><div class="muted small">${clientName(p.clientId)} · ${p.style||'—'} · ${p.status}</div></div>${isOwner()?`<span class="badge gold">${fmtMoney(p.price)}</span>`:''}</div>`).join('')}</div>`}

function inventoryStats(itemId,type){return Math.abs(state.inventoryMovements.filter(m=>m.itemId===itemId&&m.type===type).reduce((s,m)=>s+Number(m.qty),0))}
function renderInventory(){return `<div class=toolbar><button class="btn primary" onclick="openInventoryItem()">+ Articolo</button><div class=spacer></div><span class=badge>${state.inventory.filter(i=>i.qty<=i.reorderAt).length} da riordinare</span></div><div class=grid3>${state.inventory.map(i=>{let low=i.qty<=i.reorderAt,max=Math.max(i.qty,i.reorderAt*3,10),pct=Math.max(3,Math.min(100,i.qty/max*100));return `<div class="card inventory-card"><div><h3>${i.category}</h3><div class=title>${i.name}</div><div class="muted small">${i.brand} · Ciclo scorta #${i.cycle}</div><div class="metric" style="margin-top:8px">${i.qty}</div><div class=sub>pezzi disponibili · RIORDINA A ${i.reorderAt}</div><div class="stockbar ${low?'low':''}"><i style="width:${pct}%"></i></div><div class=statusline><span class=badge>Venduti ${inventoryStats(i.id,'sale')}</span><span class=badge>Regalati ${inventoryStats(i.id,'gift')}</span><span class=badge>Consumati ${inventoryStats(i.id,'usage')}</span></div>${isOwner()?`<div class="small muted owner-finance" style="margin-top:8px">Costo unitario ${fmtMoney(i.cost)}</div>`:''}</div><div style="display:flex;flex-direction:column;gap:6px"><button class=btn onclick="openInventoryMovement('${i.id}')">Scarico</button><button class=btn onclick="openRestock('${i.id}')">Rifornisci</button></div></div>`}).join('')}</div>`}

function renderCRM(){let now=localDate('2026-08-24');let rows=state.clients.map(c=>{let last=state.appointments.filter(a=>a.clientId===c.id&&a.status==='completed').sort((a,b)=>b.end.localeCompare(a.end))[0];let days=last?Math.floor((now-new Date(last.end))/86400000):999;return{c,days}}).sort((a,b)=>b.days-a.days);return `<div class=section-title><h2>Clienti da ricontattare</h2></div><div class=list>${rows.map(x=>`<div class=row><div class=grow><div class=title>${x.c.first} ${x.c.last}</div><div class="muted small">${x.days>=999?'Nessuna prestazione completata':`${x.days} giorni dall’ultima prestazione`} · Marketing ${x.c.marketing?'OK':'NO'}</div></div><button class=btn onclick="sendDemoMessage('${x.c.id}')">Messaggio demo</button></div>`).join('')}</div>`}

function renderArtists(){return `<div class=section-title><h2>Artisti e colori calendario</h2><div class=spacer></div><button class="btn primary" onclick="openArtistModal()">+ Nuovo artista</button></div><div class=list>${state.artists.map(a=>`<div class=row><div class=avatar style="background:${a.color}"></div><div class=grow><div class=title>${a.name}</div><div class="muted small">${a.role}${a.owner?' · Titolare':''}</div></div><input type=color value="${a.color}" onchange="changeArtistColor('${a.id}',this.value)" style="width:46px;height:36px;background:none;border:0"></div>`).join('')}</div>`}
function renderAdmin(){if(!isOwner())return'<div class="card locked-card"><div class=lock-title>🔒 Amministrazione · Solo titolare</div><div class=sub>Incassi, spese, saldo e transazioni non sono visibili allo Shop Manager.</div><button class="btn primary" style="margin-top:12px" onclick="showOwnerLock(&quot;Amministrazione&quot;)">Dettagli permesso</button></div>';return `<div class=finance-lock>🔒 Area riservata al Titolare</div><div class=cards style="margin-top:12px"><div class=card><h3>Incassi</h3><div class=metric>${fmtMoney(totalPayments())}</div></div><div class=card><h3>Spese</h3><div class=metric>${fmtMoney(totalExpenses())}</div></div><div class=card><h3>Saldo</h3><div class=metric>${fmtMoney(totalPayments()-totalExpenses())}</div></div></div><div class=section-title><h2>Spese studio</h2><div class=spacer></div><button class="btn primary" onclick="openExpenseModal()">+ Spesa</button></div><div class=list>${state.expenses.map(e=>`<div class=row><div class=grow><div class=title>${e.category} · ${e.supplier}</div><div class="muted small">${e.date} · ${e.method} · ${e.note||''}</div></div><b>${fmtMoney(e.amount)}</b></div>`).join('')}</div><div class=section-title><h2>Transazioni</h2></div><div class=list>${state.payments.filter(p=>p.status!=='void').map(p=>`<div class=row><div class=grow><div class=title>${clientName(p.clientId)} · ${fmtMoney(p.amount)}</div><div class="muted small">${p.date} · ${p.method} · ${p.type||'prestazione'}</div></div></div>`).join('')}</div>`}
function dayPayments(date){return state.payments.filter(p=>p.date===date&&p.status!=='void').reduce((s,p)=>s+Number(p.amount),0)}function dayExpenses(date){return state.expenses.filter(e=>e.date===date).reduce((s,e)=>s+Number(e.amount),0)}function totalPayments(){return state.payments.filter(p=>p.status!=='void').reduce((s,p)=>s+Number(p.amount),0)}function totalExpenses(){return state.expenses.reduce((s,e)=>s+Number(e.amount),0)}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function showOwnerLock(label='Area finanziaria'){openModal(`<h2>🔒 ${label}</h2><div class=notice>Questa sezione è riservata esclusivamente al <b>Titolare</b>. Lo Shop Manager può registrare il pagamento durante la chiusura di una singola seduta, ma non può consultare incassi, spese, margini o riepiloghi economici.</div><div class=modal-actions><button class=btn onclick="closeModal()">Chiudi</button><button class="btn primary" onclick="switchRole('owner')">Passa a Titolare</button></div>`)}
function openAccount(){let u=currentUser();if(!u)return;openModal(`<h2>Profilo</h2><div class=account-card><div class=account-avatar>${isOwner()?'T':'M'}</div><div><div class=title>${u.name}</div><div class=muted small>${isOwner()?'Titolare · accesso finanziario completo':'Shop Manager · dati finanziari protetti'}</div></div></div><div class=account-actions><button class="btn ${isOwner()?'':'primary'}" onclick="switchRole('owner')">${isOwner()?'✓ ':''}Titolare</button><button class="btn ${!isOwner()?'':'primary'}" onclick="switchRole('manager')">${!isOwner()?'✓ ':''}Shop Manager</button><button class=btn onclick="resetDemo();closeModal()">↺ Reset dati demo</button><button class="btn danger" onclick="logout()">Esci dall’app</button></div>`)}
function openMore(){let items=NAV.filter(x=>!['calendar','clients','home','inventory'].includes(x.id));openModal(`<h2>AREA51 · Tutte le sezioni</h2><div class=screen-intro>Ogni area apre una schermata indipendente.</div><div class=app-section-grid>${items.map(x=>`<button class="app-section ${x.owner&&!isOwner()?'locked':''}" onclick="closeModal();${x.owner&&!isOwner()?`showOwnerLock('${x.label}')`:`navigate('${x.id}')`}"><span class=app-icon>${x.owner&&!isOwner()?'🔒':x.icon}</span><span class=app-copy><b>${x.label}${x.owner?' · Solo titolare':''}</b><small>${x.desc}</small></span></button>`).join('')}</div><div class=section-title><h2>Account</h2></div><button class="app-section" style="width:100%" onclick="closeModal();openAccount()"><span class=app-icon>◉</span><span class=app-copy><b>${currentUser().name}</b><small>Cambia profilo, esci o resetta la demo</small></span></button>`)}
function openQuickAdd(){openModal(`<h2>Nuovo</h2><div class=list><button class=btn onclick="closeModal();openAppointmentModal('${route.anchor||'2026-08-24'}','10:00')">Appuntamento</button><button class=btn onclick="closeModal();openClientModal()">Cliente</button><button class=btn onclick="closeModal();openInventoryItem()">Articolo inventario</button>${isOwner()?'<button class=btn onclick="closeModal();openExpenseModal()">Spesa</button>':''}</div>`)}
function openAppointmentModal(date='2026-08-24',startTime='10:00',clientId=''){let end=addMinutesToTime(startTime,60),clients=state.clients.map(c=>`<option value="${c.id}" ${c.id===clientId?'selected':''}>${c.first} ${c.last} · ${c.phone}</option>`).join(''),arts=state.artists.filter(a=>a.active).map(a=>`<option value="${a.id}">${a.name}</option>`).join(''),sts=state.stations.filter(s=>s.active).map(s=>`<option value="${s.id}">${s.name}</option>`).join('');openModal(`<h2>Nuovo appuntamento</h2><div class=form-grid><div class=field><label>Data</label><input id=apDate type=date value="${date}"></div><div class=field><label>Durata</label><div id=apDuration class=duration>1 ora</div></div><div class=field><label>Inizio</label><input id=apStart type=time step=1800 value="${startTime}" oninput="syncDuration()"></div><div class=field><label>Fine</label><input id=apEnd type=time step=1800 value="${end}" oninput="syncDuration()"></div><div class="field full"><label>Scorciatoie</label><div class=presets>${[30,60,120,180,300].map(m=>`<button onclick="setDuration(${m})">${m<60?m+'m':m/60+'h'}</button>`).join('')}</div></div><div class="field full"><label>Cliente</label><select id=apClient><option value="">— seleziona cliente —</option>${clients}</select><button class=btn onclick="openInlineNewClient()">+ Nuovo cliente</button><div id=inlineNewClient></div></div><div class=field><label>Tipo</label><select id=apType onchange="appointmentTypeChanged()"><option value=tattoo>Tattoo</option><option value=piercing>Piercing</option><option value=consulto>Consulto</option><option value=ritocco>Ritocco</option></select></div><div class=field><label>Servizio</label><input id=apService value="Tattoo"></div><div class=field><label>Artista</label><select id=apArtist><option value="">— nessuno —</option>${arts}</select></div><div class=field><label>Postazione</label><select id=apStation><option value="">— nessuna —</option>${sts}</select></div><div class="field full"><label>Note (opzionali)</label><textarea id=apNotes></textarea></div></div><div id=apError class=error></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="createAppointment()">CREA APPUNTAMENTO</button></div>`);syncDuration()}
function addMinutesToTime(time,min){let[h,m]=time.split(':').map(Number),t=h*60+m+min;t=Math.min(t,23*60+59);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}
function syncDuration(){let s=document.getElementById('apStart'),e=document.getElementById('apEnd'),d=document.getElementById('apDuration');if(!s||!e||!d)return;let [sh,sm]=s.value.split(':').map(Number),[eh,em]=e.value.split(':').map(Number),min=(eh*60+em)-(sh*60+sm);d.textContent=min>0?durationText(min):'Orario non valido';d.style.color=min>0?'var(--gold)':'var(--red)'}
function setDuration(min){let s=document.getElementById('apStart');document.getElementById('apEnd').value=addMinutesToTime(s.value,min);syncDuration()}
function appointmentTypeChanged(){let t=document.getElementById('apType').value;if(t==='consulto'){document.getElementById('apService').value='Consulto';document.getElementById('apStation').value=''}else if(t==='piercing')document.getElementById('apService').value='Piercing';else if(t==='ritocco')document.getElementById('apService').value='Ritocco';else document.getElementById('apService').value='Tattoo'}
function openInlineNewClient(){document.getElementById('inlineNewClient').innerHTML=`<div class=grid2 style="margin-top:8px"><div class=field><label>Nome</label><input id=ncFirst></div><div class=field><label>Cognome</label><input id=ncLast></div><div class=field><label>Telefono</label><input id=ncPhone></div><div class=field><label>Email</label><input id=ncEmail></div></div><button class="btn good" style="margin-top:8px" onclick="createInlineClient()">Crea e seleziona</button>`}
function createInlineClient(){let first=document.getElementById('ncFirst').value.trim(),last=document.getElementById('ncLast').value.trim(),phone=document.getElementById('ncPhone').value.trim();if(!first||!phone){alert('Inserisci almeno nome e telefono.');return}let c={id:uid(),first,last,phone,email:document.getElementById('ncEmail').value.trim(),birth:'',whatsapp:false,marketing:false,notes:''};state.clients.push(c);save();let sel=document.getElementById('apClient');sel.innerHTML+=`<option value="${c.id}">${c.first} ${c.last} · ${c.phone}</option>`;sel.value=c.id;document.getElementById('inlineNewClient').innerHTML='<span class="badge good">Cliente creato e selezionato</span>'}
function createAppointment(){let date=document.getElementById('apDate').value,start=document.getElementById('apStart').value,end=document.getElementById('apEnd').value,clientId=document.getElementById('apClient').value,type=document.getElementById('apType').value,artistId=document.getElementById('apArtist').value,stationId=document.getElementById('apStation').value,service=document.getElementById('apService').value.trim()||type,err=document.getElementById('apError');let startISO=date+'T'+start+':00',endISO=date+'T'+end+':00';if(!date||!clientId||new Date(endISO)<=new Date(startISO)){err.textContent='Controlla cliente e orari.';return}if(type!=='consulto'&&!stationId){err.textContent='Seleziona una postazione.';return}let conflict=state.appointments.find(a=>a.status!=='cancelled'&&overlap(startISO,endISO,a.start,a.end)&&((stationId&&a.stationId===stationId)||(artistId&&a.artistId===artistId)));if(conflict){err.textContent=`Conflitto con ${clientName(conflict.clientId)} ${fmtTime(conflict.start)}–${fmtTime(conflict.end)}.`;return}state.appointments.push({id:uid(),clientId,artistId:artistId||null,stationId:stationId||null,type,service,projectId:null,start:startISO,end:endISO,status:'confirmed',notes:document.getElementById('apNotes').value.trim()});state.audit.push({at:new Date().toISOString(),action:'appointment_created',clientId});save();closeModal();route.anchor=date;render()}
function openAppointmentDetail(id){let a=state.appointments.find(x=>x.id===id);if(!a)return;let ar=artist(a.artistId),st=station(a.stationId);openModal(`<h2>${clientName(a.clientId)}</h2><div class=detail-kv><div>Quando</div><div>${fmtDate(a.start.slice(0,10))} · ${fmtTime(a.start)}–${fmtTime(a.end)}</div><div>Durata</div><div>${durationText(durationMinutes(a.start,a.end))}</div><div>Servizio</div><div>${a.service}</div><div>Artista</div><div>${ar?.name||'—'}</div><div>Postazione</div><div>${st?.name||'—'}</div><div>Stato</div><div>${a.status}</div></div><div class=modal-actions><button class=btn onclick="closeModal();navigate('client',{clientId:'${a.clientId}'})">Apri cliente</button>${a.status==='confirmed'?`<button class="btn danger" onclick="closeModal();openCancel('${a.id}')">Annulla</button><button class="btn good" onclick="closeModal();openComplete('${a.id}')">Completa</button>`:''}<button class=btn onclick="closeModal()">Chiudi</button></div>`)}
function projectQuoteRemaining(clientId,projectId){if(!projectId)return null;let q=state.quotes.find(q=>q.clientId===clientId&&q.projectId===projectId&&q.status==='accepted');if(!q)return null;let paid=state.payments.filter(p=>p.clientId===clientId&&p.projectId===projectId&&p.status!=='void').reduce((s,p)=>s+Number(p.amount),0);return Math.max(0,Number(q.amount)-paid)}
function openComplete(id){let a=state.appointments.find(x=>x.id===id);if(!a||a.status!=='confirmed'){alert('Questa sessione non è più chiudibile.');return}let remain=projectQuoteRemaining(a.clientId,a.projectId);openModal(`<h2>Completa sessione — ${clientName(a.clientId)}</h2>${remain!==null?`<div class=notice>Saldo proposto da preventivo: <b>${fmtMoney(remain)}</b>. Puoi modificarlo.</div>`:'<div class=notice>Nessun preventivo collegato: inserisci l’importo effettivamente ricevuto.</div>'}<div class=form-grid style="margin-top:12px"><div class=field><label>Importo ricevuto oggi</label><input id=cpAmount type=number min=0 step=.01 value="${remain!==null?remain:''}"></div><div class=field><label>Metodo</label><select id=cpMethod><option>POS</option><option>Contanti</option><option>Satispay</option><option>Bonifico</option><option>Altro</option></select></div><div class="field full"><label>Nota</label><input id=cpNote></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Indietro</button><button class="btn good" onclick="completeAppointment('${id}')">CONFERMA E COMPLETA</button></div>`)}
function completeAppointment(id){let a=state.appointments.find(x=>x.id===id);if(!a||a.status!=='confirmed'){alert('Sessione già chiusa o annullata.');return}let amount=Number(document.getElementById('cpAmount').value||0),method=document.getElementById('cpMethod').value;if(amount<0){alert('Importo non valido.');return}a.status='completed';a.completedAt=new Date().toISOString();if(amount>0)state.payments.push({id:uid(),clientId:a.clientId,appointmentId:a.id,projectId:a.projectId,amount,method,status:'paid',date:a.start.slice(0,10),type:'service',note:document.getElementById('cpNote').value.trim()});state.audit.push({at:new Date().toISOString(),action:'appointment_completed',appointmentId:id,amount,userId:currentUser().id});save();closeModal();render()}
function openCancel(id){let a=state.appointments.find(x=>x.id===id);if(!a||a.status!=='confirmed')return;openModal(`<h2>Annulla — ${clientName(a.clientId)}</h2><div class=field><label>Motivo</label><select id=cancelReason><option value="">— scegli —</option><option>Cliente — ultimo momento</option><option>Cliente — con preavviso</option><option>Malattia / indisponibilità</option><option>Esigenza studio</option><option>Altro</option></select></div><div class=field style="margin-top:10px"><label>Nota</label><textarea id=cancelNote></textarea></div><div id=cancelErr class=error></div><div class=modal-actions><button class=btn onclick="closeModal()">Indietro</button><button class="btn danger" onclick="cancelAppointment('${id}')">CONFERMA ANNULLAMENTO</button></div>`)}
function cancelAppointment(id){let r=document.getElementById('cancelReason').value;if(!r){document.getElementById('cancelErr').textContent='Il motivo è obbligatorio.';return}let a=state.appointments.find(x=>x.id===id);a.status='cancelled';a.cancelReason=r;a.cancelNote=document.getElementById('cancelNote').value.trim();state.audit.push({at:new Date().toISOString(),action:'appointment_cancelled',appointmentId:id,reason:r,userId:currentUser().id});save();closeModal();render()}
function openClientModal(id=''){let c=id?state.clients.find(x=>x.id===id):{first:'',last:'',phone:'',email:'',birth:'',whatsapp:false,marketing:false,notes:''};openModal(`<h2>${id?'Modifica':'Nuovo'} cliente</h2><div class=form-grid><div class=field><label>Nome</label><input id=clFirst value="${c.first}"></div><div class=field><label>Cognome</label><input id=clLast value="${c.last}"></div><div class=field><label>Telefono</label><input id=clPhone value="${c.phone}"></div><div class=field><label>Email</label><input id=clEmail value="${c.email}"></div><div class=field><label>Data nascita</label><input id=clBirth type=date value="${c.birth}"></div><div class=field><label>WhatsApp</label><select id=clWA><option value=1 ${c.whatsapp?'selected':''}>Sì</option><option value=0 ${!c.whatsapp?'selected':''}>No</option></select></div><div class=field><label>Marketing</label><select id=clMk><option value=1 ${c.marketing?'selected':''}>Sì</option><option value=0 ${!c.marketing?'selected':''}>No</option></select></div><div class="field full"><label>Note</label><textarea id=clNotes>${c.notes}</textarea></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveClient('${id}')">SALVA</button></div>`)}
function saveClient(id){let first=document.getElementById('clFirst').value.trim(),phone=document.getElementById('clPhone').value.trim();if(!first||!phone){alert('Nome e telefono sono obbligatori.');return}let c=id?state.clients.find(x=>x.id===id):{id:uid()};Object.assign(c,{first,last:document.getElementById('clLast').value.trim(),phone,email:document.getElementById('clEmail').value.trim(),birth:document.getElementById('clBirth').value,whatsapp:document.getElementById('clWA').value==='1',marketing:document.getElementById('clMk').value==='1',notes:document.getElementById('clNotes').value.trim()});if(!id)state.clients.push(c);save();closeModal();if(route.page==='client'){route.clientId=c.id}render()}
function openProjectModal(clientId=''){let opts=state.clients.map(c=>`<option value="${c.id}" ${c.id===clientId?'selected':''}>${c.first} ${c.last}</option>`).join('');openModal(`<h2>Nuovo progetto</h2><div class=form-grid><div class="field full"><label>Cliente</label><select id=prClient>${opts}</select></div><div class=field><label>Titolo</label><input id=prTitle></div><div class=field><label>Stile</label><input id=prStyle></div><div class=field><label>Prezzo concordato</label><input id=prPrice type=number min=0 step=.01></div><div class=field><label>Stato</label><select id=prStatus><option>richiesta</option><option>preventivo</option><option>approvato</option><option>in_corso</option><option>completato</option></select></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveProject()">SALVA</button></div>`)}
function saveProject(){let t=document.getElementById('prTitle').value.trim();if(!t){alert('Inserisci il titolo.');return}state.projects.push({id:uid(),clientId:document.getElementById('prClient').value,title:t,style:document.getElementById('prStyle').value.trim(),price:Number(document.getElementById('prPrice').value||0),status:document.getElementById('prStatus').value});save();closeModal();render()}
function signConsent(id){let c=state.consents.find(x=>x.id===id);c.status='signed';c.signedAt=new Date().toISOString();save();render()}
function openInventoryItem(){openModal(`<h2>Nuovo articolo</h2><div class=form-grid><div class=field><label>Nome</label><input id=iiName></div><div class=field><label>Marca</label><input id=iiBrand></div><div class=field><label>Categoria</label><select id=iiCat><option>Aftercare tattoo</option><option>Aftercare piercing</option><option>Inchiostro</option><option>Gioiello</option><option>Consumabile</option><option>Altro</option></select></div><div class=field><label>Quantità iniziale</label><input id=iiQty type=number min=0 value=0></div><div class=field><label>Riordina a</label><input id=iiMin type=number min=0 value=4></div><div class=field><label>Prezzo vendita</label><input id=iiPrice type=number min=0 step=.01 value=0></div>${isOwner()?'<div class="field owner-finance"><label>Costo unitario</label><input id=iiCost type=number min=0 step=.01 value=0></div>':''}</div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveInventoryItem()">SALVA</button></div>`)}
function saveInventoryItem(){let name=document.getElementById('iiName').value.trim();if(!name){alert('Nome obbligatorio.');return}let item={id:uid(),name,brand:document.getElementById('iiBrand').value.trim(),category:document.getElementById('iiCat').value,qty:Number(document.getElementById('iiQty').value||0),reorderAt:Number(document.getElementById('iiMin').value||0),price:Number(document.getElementById('iiPrice').value||0),cost:isOwner()?Number(document.getElementById('iiCost').value||0):0,cycle:1,active:true};state.inventory.push(item);state.stockCycles.push({id:uid(),itemId:item.id,number:1,opened:'2026-08-24',received:item.qty,closed:null});save();closeModal();render()}
function openInventoryMovement(itemId){let i=state.inventory.find(x=>x.id===itemId);openModal(`<h2>Scarico — ${i.name}</h2><div class=form-grid><div class=field><label>Tipo</label><select id=mvType><option value=sale>Venduto</option><option value=gift>Regalato</option><option value=usage>Consumato</option><option value=waste>Scarto / rettifica</option></select></div><div class=field><label>Quantità</label><input id=mvQty type=number min=1 value=1></div><div class="field full"><label>Cliente (opzionale)</label><select id=mvClient><option value="">— nessuno —</option>${state.clients.map(c=>`<option value="${c.id}">${c.first} ${c.last}</option>`).join('')}</select></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveMovement('${itemId}')">CONFERMA</button></div>`)}
function saveMovement(itemId){let i=state.inventory.find(x=>x.id===itemId),q=Number(document.getElementById('mvQty').value||0),t=document.getElementById('mvType').value;if(q<=0||q>i.qty){alert('Quantità non disponibile.');return}i.qty-=q;state.inventoryMovements.push({id:uid(),itemId,type:t,qty:-q,date:'2026-08-24',clientId:document.getElementById('mvClient').value||null});save();closeModal();render()}
function openRestock(itemId){let i=state.inventory.find(x=>x.id===itemId);openModal(`<h2>Nuova scorta — ${i.name}</h2><div class=notice>Il ciclo #${i.cycle} resta nello storico. Il nuovo rifornimento apre il ciclo #${i.cycle+1}.</div><div class=field style="margin-top:12px"><label>Quantità ricevuta</label><input id=rsQty type=number min=1 value=10></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveRestock('${itemId}')">APRI NUOVA SCORTA</button></div>`)}
function saveRestock(itemId){let i=state.inventory.find(x=>x.id===itemId),q=Number(document.getElementById('rsQty').value||0);if(q<=0)return;let prev=state.stockCycles.find(c=>c.itemId===itemId&&c.number===i.cycle);if(prev)prev.closed='2026-08-24';i.cycle++;i.qty=q;state.stockCycles.push({id:uid(),itemId,number:i.cycle,opened:'2026-08-24',received:q,closed:null});save();closeModal();render()}
function openShopAction(itemId,type){let i=state.inventory.find(x=>x.id===itemId);openModal(`<h2>${type==='sale'?'Vendi':'Regala'} — ${i.name}</h2><div class=form-grid><div class="field full"><label>Cliente</label><select id=shClient>${state.clients.map(c=>`<option value="${c.id}">${c.first} ${c.last}</option>`).join('')}</select></div><div class=field><label>Quantità</label><input id=shQty type=number min=1 value=1></div>${type==='sale'?`<div class=field><label>Importo totale</label><input id=shAmount type=number min=0 step=.01 value="${i.price}"></div><div class=field><label>Metodo</label><select id=shMethod><option>POS</option><option>Contanti</option><option>Satispay</option><option>Bonifico</option></select></div>`:''}</div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveShopAction('${itemId}','${type}')">CONFERMA</button></div>`)}
function saveShopAction(itemId,type){let i=state.inventory.find(x=>x.id===itemId),q=Number(document.getElementById('shQty').value||0),clientId=document.getElementById('shClient').value;if(q<=0||q>i.qty){alert('Quantità non disponibile.');return}i.qty-=q;state.inventoryMovements.push({id:uid(),itemId,type,qty:-q,date:'2026-08-24',clientId});if(type==='sale'){state.payments.push({id:uid(),clientId,appointmentId:null,projectId:null,amount:Number(document.getElementById('shAmount').value||0),method:document.getElementById('shMethod').value,status:'paid',date:'2026-08-24',type:'shop',note:i.name})}save();closeModal();render()}
function openArtistModal(){openModal(`<h2>Nuovo artista</h2><div class=form-grid><div class=field><label>Nome</label><input id=arName></div><div class=field><label>Ruolo</label><select id=arRole><option>Tattoo</option><option>Piercing</option></select></div><div class=field><label>Colore</label><input id=arColor type=color value="${COLORS[state.artists.length%COLORS.length]}"></div><div class=field><label>Titolare</label><select id=arOwner><option value=0>No</option><option value=1>Sì</option></select></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveArtist()">SALVA</button></div>`)}
function saveArtist(){let n=document.getElementById('arName').value.trim();if(!n)return;state.artists.push({id:uid(),name:n,role:document.getElementById('arRole').value,color:document.getElementById('arColor').value,owner:document.getElementById('arOwner').value==='1',active:true});save();closeModal();render()}
function changeArtistColor(id,color){artist(id).color=color;save();render()}
function openExpenseModal(){if(!isOwner())return;openModal(`<h2>Registra spesa</h2><div class=form-grid><div class=field><label>Data</label><input id=exDate type=date value="2026-08-24"></div><div class=field><label>Categoria</label><select id=exCat><option>Materiali</option><option>Personale</option><option>Affitto / Utenze</option><option>Corsi / Formazione</option><option>Fiere / Eventi</option><option>Marketing</option><option>Software</option><option>Manutenzione</option><option>Professionisti</option><option>Imposte</option><option>Altro</option></select></div><div class=field><label>Fornitore / Beneficiario</label><input id=exSupplier></div><div class=field><label>Importo</label><input id=exAmount type=number min=0 step=.01></div><div class=field><label>Metodo</label><select id=exMethod><option>Bonifico</option><option>POS</option><option>Contanti</option><option>Satispay</option><option>Altro</option></select></div><div class="field full"><label>Nota</label><input id=exNote></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveExpense()">SALVA</button></div>`)}
function saveExpense(){let amount=Number(document.getElementById('exAmount').value||0);if(amount<=0){alert('Importo non valido.');return}state.expenses.push({id:uid(),date:document.getElementById('exDate').value,category:document.getElementById('exCat').value,supplier:document.getElementById('exSupplier').value.trim(),amount,method:document.getElementById('exMethod').value,note:document.getElementById('exNote').value.trim()});save();closeModal();render()}
function openPaymentEdit(id){if(!isOwner())return;let p=state.payments.find(x=>x.id===id);openModal(`<h2>Modifica transazione</h2><div class=form-grid><div class=field><label>Importo</label><input id=peAmount type=number min=0 step=.01 value="${p.amount}"></div><div class=field><label>Metodo</label><select id=peMethod>${['POS','Contanti','Satispay','Bonifico','Altro'].map(x=>`<option ${x===p.method?'selected':''}>${x}</option>`).join('')}</select></div></div><div class=modal-actions><button class=btn onclick="closeModal()">Annulla</button><button class="btn primary" onclick="savePaymentEdit('${id}')">SALVA</button></div>`)}
function savePaymentEdit(id){let p=state.payments.find(x=>x.id===id);p.amount=Number(document.getElementById('peAmount').value||0);p.method=document.getElementById('peMethod').value;state.audit.push({at:new Date().toISOString(),action:'payment_edited',paymentId:id,userId:currentUser().id});save();closeModal();render()}
function voidPayment(id){if(!isOwner())return;if(!confirm('Annullare questa transazione? Rimarrà nello storico con valore netto zero.'))return;let p=state.payments.find(x=>x.id===id);p.status='void';state.audit.push({at:new Date().toISOString(),action:'payment_voided',paymentId:id,userId:currentUser().id});save();render()}
function sendDemoMessage(clientId){state.messages.push({id:uid(),clientId,date:new Date().toISOString(),status:'demo',text:'Messaggio demo CRM'});save();alert('Messaggio registrato in modalità demo. Nessun WhatsApp reale è stato inviato.')}
function openAlerts(){let low=state.inventory.filter(i=>i.qty<=i.reorderAt),today=state.appointments.filter(a=>a.start.slice(0,10)==='2026-08-24'&&a.status==='confirmed');openModal(`<h2>Priorità</h2><div class=list>${low.map(i=>`<div class=row><div class=grow><div class=title>Scorta bassa: ${i.name}</div><div class="muted small">${i.qty} rimasti · riordina a ${i.reorderAt}</div></div></div>`).join('')}${today.map(a=>`<div class=row><div class=grow><div class=title>${clientName(a.clientId)} · ${fmtTime(a.start)}</div><div class="muted small">Appuntamento da completare</div></div></div>`).join('')}</div>`)}
function updateAlerts(){document.getElementById('alertCount').textContent=state.inventory.filter(i=>i.qty<=i.reorderAt).length+state.appointments.filter(a=>a.start.slice(0,10)==='2026-08-24'&&a.status==='confirmed').length}
function resetDemo(){if(confirm('Ripristinare tutti i dati demo?')){let role=currentUser()?.role||'owner';state=seed();save();let u=state.users.find(x=>x.role===role);session={userId:u.id};saveSession();route={page:'calendar',calendarView:'week',anchor:'2026-08-24',clientId:null};renderNav();render()}}
window.addEventListener('load',()=>{if(session&&currentUser())showApp();else{document.getElementById('loginScreen').classList.remove('hidden')}document.getElementById('loginPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})});
</script>
</body></html>
