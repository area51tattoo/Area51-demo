/* 9.3.9 — native-feel interaction feedback.
   The real UI is never greyed. A tiny transient overlay confirms a true click/tap. */
button,a,[onclick],[role="button"],.clickable,input,select,textarea,summary{
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.area51-press-ghost{
  position:fixed;
  z-index:2147483646;
  pointer-events:none;
  box-sizing:border-box;
  background:rgba(145,150,153,.105);
  border:1px solid rgba(180,185,188,.07);
  opacity:0;
  transform:scale(.992);
  animation:area51GhostPress .072s ease-out forwards;
}
.area51-press-dot{
  position:fixed;
  z-index:2147483646;
  pointer-events:none;
  width:20px;
  height:20px;
  margin:-10px 0 0 -10px;
  border-radius:999px;
  background:rgba(155,160,163,.13);
  opacity:0;
  transform:scale(.62);
  animation:area51DotPress .068s ease-out forwards;
}
@keyframes area51GhostPress{
  0%{opacity:.78;transform:scale(.992)}
  52%{opacity:.40;transform:scale(.997)}
  100%{opacity:0;transform:scale(1)}
}
@keyframes area51DotPress{
  0%{opacity:.68;transform:scale(.62)}
  100%{opacity:0;transform:scale(1.12)}
}

/* 9.3.12 — fixed calendar chrome + continuous magnetic carousel */
.calendar-shell{
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}
.calendar-static{
  position:relative;
  z-index:4;
}
.calendar-swipe-viewport{
  position:relative;
  width:100%;
  overflow:hidden;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
  isolation:isolate;
}
.calendar-swipe-track{
  display:flex;
  width:100%;
  transform:translate3d(-100%,0,0);
  will-change:transform;
}
.calendar-swipe-track.dragging{
  transition:none!important;
  cursor:grabbing;
}
.calendar-swipe-track.animating{
  transition:transform .24s cubic-bezier(.22,.78,.22,1)!important;
}
.calendar-slide{
  flex:0 0 100%;
  width:100%;
  min-width:100%;
  box-sizing:border-box;
  background:var(--bg);
}

  animation:calendarRangeRefresh .12s ease-out;

  from{opacity:.62;transform:translateY(1px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .calendar-swipe-track.animating{transition-duration:.01ms!important}
  .calendar-range-refresh{animation:none!important}
}

 projects:[{id:'pr_marco',clientId:marco,title:'Manica giapponese',style:'Japanese',status:'in_corso',price:1200},{id:'pr_anna',clientId:anna,title:'Fine line fiore',style:'Fine line',status:'approvato',price:180}],

let state=load(); let session=loadSession(); let route={page:'calendar',calendarView:'week',anchor:'2026-08-24',clientId:null,day:null};

const NAV=[
 {id:'home',label:'Home',icon:'⌂',desc:'Oggi e priorità'},
 {id:'calendar',label:'Calendario',icon:'▦',desc:'Giorno, settimana e mese'},

function showApp(){if(!currentUser()){logout();return}document.getElementById('loginScreen').classList.add('hidden');let app=document.getElementById('app');app.classList.remove('hidden');app.classList.toggle('manager',!isOwner());renderNav();updateProfileUI();navigate('home')}
function updateProfileUI(){let u=currentUser();if(!u)return;document.getElementById('topProfileName').textContent=u.name;document.getElementById('topProfileRole').textContent=isOwner()?'Titolare':'Shop Manager';document.getElementById('roleChip').innerHTML=`<b>${u.name}</b><br>${isOwner()?'Titolare · accesso completo':'Shop Manager · gestione operativa'}`}
function navAction(item){return `navigate('${item.id}')`}

function setActiveNav(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===route.page))}

  if(page==='projects')page='clients';

}

function upcomingToday(){let d=route.anchor||'2026-08-24';return state.appointments.filter(a=>a.start.slice(0,10)===d).sort((a,b)=>a.start.localeCompare(b.start))}
function renderHome(){let d='2026-08-24',apps=state.appointments.filter(a=>a.start.slice(0,10)===d).sort((a,b)=>a.start.localeCompare(b.start));let confirmed=apps.filter(a=>a.status==='confirmed').length;let missing=apps.filter(a=>!state.consents.some(c=>c.clientId===a.clientId&&c.status==='signed')).length;let next=apps.find(a=>a.status==='confirmed');let finance=isOwner()?`<span class="focus-chip owner-finance">Oggi ${fmtMoney(dayPayments(d))}</span>`:'',statusChip=isOwner()?`${confirmed} da chiudere`:`${confirmed} confermati`;return `<div class="home-focus"><div><span class=eyebrow>AREA51 · OGGI</span><h2>${dateLong(d)}</h2><div class=focus-chips><span class=focus-chip>${apps.length} appuntamenti</span><span class="focus-chip ${confirmed?'warn':''}">${statusChip}</span><span class="focus-chip ${missing?'warn':''}">${missing} consensi mancanti</span>${finance}</div></div><button class="btn focus-calendar" onclick="navigate('calendar',{anchor:'${d}',calendarView:'week'})">Apri agenda →</button></div><div class="quick-actions quick-clean"><button class="quick-action primary-quick" onclick="openAppointmentModal('${d}','10:00')"><span>＋</span><b>Nuovo appuntamento</b><small>Prenota in pochi tocchi</small></button><button class=quick-action onclick="openClientModal()"><span>◎</span><b>Nuovo cliente</b><small>Anagrafica rapida</small></button><button class=quick-action onclick="openQuickAdd()"><span>•••</span><b>Altro</b><small>Consenso, inventario…</small></button></div>${next?`<div class=next-up><span class=eyebrow>PROSSIMO</span><button onclick="openAppointmentDetail('${next.id}')"><b>${fmtTime(next.start)} · ${clientName(next.clientId)}</b><small>${next.service} · ${artist(next.artistId)?.name||'—'} · ${station(next.stationId)?.name||'—'}</small></button></div>`:''}<div class=section-title><h2>Agenda di oggi</h2></div><div class="list clean-list">${apps.map(appointmentRow).join('')||'<div class=empty-agenda>Nessun appuntamento oggi.</div>'}</div>`}
function appointmentRow(a){let ar=artist(a.artistId),st=station(a.stationId);let action=a.status==='confirmed'?`<div class=row-actions><button class="btn good" onclick="event.stopPropagation();openComplete('${a.id}')">Completa</button><button class="btn danger" onclick="event.stopPropagation();openCancel('${a.id}')">Annulla</button></div>`:`<span class="badge ${a.status==='completed'?'good':'red'}">${a.status==='completed'?'COMPLETATO':'ANNULLATO'}</span>`;return `<div class="row clickable" onclick="openAppointmentDetail('${a.id}')"><div class=avatar style="border:2px solid ${ar?.color||'#555'}">${fmtTime(a.start)}</div><div class=grow><div class=title>${clientName(a.clientId)}</div><div class="muted small">${a.service} · ${ar?.name||'—'} · ${st?.name||'Nessuna postazione'}</div><div class="muted small" style="margin-top:3px">${fmtTime(a.start)}–${fmtTime(a.end)} · ${durationText(durationMinutes(a.start,a.end))}</div></div>${action}</div>`}
function calendarAnchorShift(anchor,view,direction){
  if(view==='month'){
    let d=localDate(anchor);
    d.setMonth(d.getMonth()+direction);
    return isoDate(d);
  }
  if(view==='week')return addDays(anchor,direction*7);

  let next=addDays(anchor,direction);
  /* AREA51 works Monday–Saturday: day navigation skips Sunday. */
  if(localDate(next).getDay()===0)next=addDays(next,direction);
  return next;
}
function calendarPanelHtml(anchor,view){
  return view==='week'?weekView(anchor):view==='day'?dayView(anchor):monthView(anchor);
}
function calendarCarouselHtml(anchor,view){
  let prev=calendarAnchorShift(anchor,view,-1),
      next=calendarAnchorShift(anchor,view,1);
  return `<div class=calendar-swipe-viewport>
    <div class=calendar-swipe-track>
      <div class=calendar-slide data-anchor="${prev}">${calendarPanelHtml(prev,view)}</div>
      <div class="calendar-slide calendar-slide-current" data-anchor="${anchor}">${calendarPanelHtml(anchor,view)}</div>
      <div class=calendar-slide data-anchor="${next}">${calendarPanelHtml(next,view)}</div>
    </div>
  </div>`
}
function renderCalendar(){
  let a=route.anchor||'2026-08-24';
  let views=`<div class=seg>
    <button class="${route.calendarView==='day'?'active':''}" onclick="setCalendarView('day')">Giorno</button>
    <button class="${route.calendarView==='week'?'active':''}" onclick="setCalendarView('week')">Settimana</button>
    <button class="${route.calendarView==='month'?'active':''}" onclick="setCalendarView('month')">Mese</button>
  </div>`;
  return `<div class=calendar-shell>
    <div class=calendar-static>
      <div class=calendar-nav-card>
        <button class=cal-arrow onclick="calendarPrev()">‹</button>
        <div class=range>
          <b id=calendarRangeMain>${calendarRangeLabel(a,route.calendarView)}</b>
          <small id=calendarRangeSub>${calendarRangeSub(a,route.calendarView)}</small>
        </div>
        <button class=cal-arrow onclick="calendarNext()">›</button>
      </div>
      <div class=calendar-actions>${views}<button class=today-btn onclick="goToday()">Oggi</button></div>
    </div>
    ${calendarCarouselHtml(a,route.calendarView)}
  </div>`
}
function updateCalendarStaticLabels(){
  let main=document.getElementById('calendarRangeMain'),
      sub=document.getElementById('calendarRangeSub'),
      topSub=document.getElementById('pageSub');
  if(main){
    main.textContent=calendarRangeLabel(route.anchor,route.calendarView);
    main.classList.remove('calendar-range-refresh');
    void main.offsetWidth;
    main.classList.add('calendar-range-refresh');
  }
  if(sub)sub.textContent=calendarRangeSub(route.anchor,route.calendarView);
  if(topSub)topSub.textContent=calendarRangeLabel(route.anchor,route.calendarView);
}
function rebuildCalendarCarousel(){
  const viewport=document.querySelector('.calendar-swipe-viewport');
  if(!viewport)return;
  const a=route.anchor||'2026-08-24',
        view=route.calendarView,
        prev=calendarAnchorShift(a,view,-1),
        next=calendarAnchorShift(a,view,1);
  viewport.innerHTML=`<div class=calendar-swipe-track>
    <div class=calendar-slide data-anchor="${prev}">${calendarPanelHtml(prev,view)}</div>
    <div class="calendar-slide calendar-slide-current" data-anchor="${a}">${calendarPanelHtml(a,view)}</div>
    <div class=calendar-slide data-anchor="${next}">${calendarPanelHtml(next,view)}</div>
  </div>`;
}
let area51CalendarAnimating=false;
function area51AnimateCalendar(direction,fromDragPx=null){
  if(area51CalendarAnimating)return;
  const viewport=document.querySelector('.calendar-swipe-viewport'),
        track=viewport?.querySelector('.calendar-swipe-track');
  if(!viewport||!track){
    route.anchor=calendarAnchorShift(route.anchor,route.calendarView,direction);
    render();
    return;
  }

  area51CalendarAnimating=true;
  const width=Math.max(1,viewport.getBoundingClientRect().width);
  const targetX=direction>0?-2*width:0;

  track.classList.remove('dragging');
  track.classList.add('animating');
  requestAnimationFrame(()=>{track.style.transform=`translate3d(${targetX}px,0,0)`});

  let completed=false;
  const finish=()=>{
    if(completed)return;
    completed=true;
    route.anchor=calendarAnchorShift(route.anchor,route.calendarView,direction);
    updateCalendarStaticLabels();

    /* Rebuild the three panels while keeping header/actions untouched. */
    rebuildCalendarCarousel();
    area51CalendarAnimating=false;
  };
  track.addEventListener('transitionend',finish,{once:true});
  setTimeout(finish,300);
}
function calendarPrev(){area51AnimateCalendar(-1)}
function calendarNext(){area51AnimateCalendar(1)}

function area51PressTarget(node){

function area51IsLargeSurface(el){

  if(el.matches('button,a,input,select,textarea,summary,.gweek-dayhead,.gweek-event,.week-day-btn,.month-ev,.compact-event,.event,.quick-action,.top-profile,.cal-arrow,.today-btn,.app-section,.row.clickable'))return false;

function area51RemoveGhost(node){
  if(!node)return;
  try{node.remove()}catch(_){}

function area51GhostFeedback(el,e){
  if(!el||area51StructuralTarget(el))return;

  const x = e && Number.isFinite(e.clientX) ? e.clientX : null;
  const y = e && Number.isFinite(e.clientY) ? e.clientY : null;

  /* Big calendar surfaces get only a tiny point response, never a grey panel. */
  if(area51IsLargeSurface(el) && x!==null && y!==null){
    const dot=document.createElement('span');
    dot.className='area51-press-dot';
    dot.style.left=x+'px';
    dot.style.top=y+'px';
    document.body.appendChild(dot);
    setTimeout(()=>area51RemoveGhost(dot),90);
    return;
  }

  const r=el.getBoundingClientRect();
  if(r.width<2||r.height<2)return;

  /* Safety: never create a near-full-screen grey rectangle. */
  if(r.width>window.innerWidth*.86 && r.height>window.innerHeight*.28){
    if(x!==null&&y!==null){
      const dot=document.createElement('span');
      dot.className='area51-press-dot';
      dot.style.left=x+'px';
      dot.style.top=y+'px';
      document.body.appendChild(dot);
      setTimeout(()=>area51RemoveGhost(dot),90);
    }
    return;
  }

  const ghost=document.createElement('span');
  ghost.className='area51-press-ghost';
  const cs=getComputedStyle(el);
  ghost.style.left=r.left+'px';
  ghost.style.top=r.top+'px';
  ghost.style.width=r.width+'px';
  ghost.style.height=r.height+'px';
  ghost.style.borderRadius=cs.borderRadius || '10px';
  document.body.appendChild(ghost);
  setTimeout(()=>area51RemoveGhost(ghost),95);
}

function installUniversalPressFeedback(){
  /* Track touch movement only to distinguish tap from scroll.
     We do NOT show any visual state on pointerdown. */
  let touchGesture=null;
  let suppressNextTouchClickUntil=0;

  if(window.PointerEvent){
    document.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='touch')return;
      let target=area51PressTarget(e.target);
      touchGesture=target?{target,x:e.clientX,y:e.clientY,moved:false}:null;
    },true);

    document.addEventListener('pointermove',e=>{
      if(e.pointerType!=='touch'||!touchGesture)return;
      if(Math.hypot(e.clientX-touchGesture.x,e.clientY-touchGesture.y)>3.5){
        touchGesture.moved=true;
        suppressNextTouchClickUntil=performance.now()+320;
      }
    },true);

    document.addEventListener('pointercancel',e=>{
      if(e.pointerType==='touch')touchGesture=null;
    },true);

    document.addEventListener('pointerup',e=>{
      if(e.pointerType==='touch'){
        if(touchGesture&&touchGesture.moved)suppressNextTouchClickUntil=performance.now()+320;
        touchGesture=null;
      }
    },true);
  }

  /* A real click is the confirmation.
     Because the overlay lives on document.body, it survives immediate renders
     and therefore needs NO artificial delay before navigation. */
  document.addEventListener('click',e=>{
    const target=area51PressTarget(e.target);
    if(!target)return;

    const now=performance.now();
    const isTouchLike = (e.pointerType==='touch') || ('ontouchstart' in window && e.detail!==0);

    if(isTouchLike && now<suppressNextTouchClickUntil)return;
    area51GhostFeedback(target,e);
  },true);

  /* Desktop mouse: extremely light feedback on press, then suppress duplicate click. */
  let lastMousePressTarget=null;
  let lastMousePressAt=0;
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='touch')return;
    const target=area51PressTarget(e.target);
    if(!target)return;
    lastMousePressTarget=target;
    lastMousePressAt=performance.now();
    area51GhostFeedback(target,e);
  },true);

  document.addEventListener('click',e=>{
    if(!lastMousePressTarget)return;
    if(performance.now()-lastMousePressAt<180){
      lastMousePressTarget=null;
    }
  },true);

  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const target=area51PressTarget(e.target);
    if(target)area51GhostFeedback(target,null);
  },true);
}

function syncDuration(){let s=document.getElementById('apStart'),e=document.getElementById('apEnd'),d=document.getElementById('apDuration');if(!s||!e||!d)return;let [sh,sm]=s.value.split(':').map(Number),[eh,em]=e.value.split(':').map(Number),min=(eh*60+em)-(sh*60+sm);d.textContent=min>0?durationText(min):'Orario non valido';d.style.color=min>0?'var(--gold)':'var(--red)'}

function createAppointment(){
  let date=document.getElementById('apDate').value,
      start=document.getElementById('apStart').value,
      end=document.getElementById('apEnd').value,
      clientId=document.getElementById('apClient').value,
      type=document.getElementById('apType').value,
      artistId=document.getElementById('apArtist').value,
      stationId=document.getElementById('apStation').value,
      projectId=document.getElementById('apProject')?.value||null,
      deposit=Number(document.getElementById('apDeposit')?.value||0),
      depositMethod=document.getElementById('apDepositMethod')?.value||'POS',
      service=document.getElementById('apService').value.trim()||type,
      err=document.getElementById('apError');

  let startISO=date+'T'+start+':00',endISO=date+'T'+end+':00';
  if(!date||!clientId||new Date(endISO)<=new Date(startISO)){err.textContent='Seleziona il cliente e controlla gli orari.';return}
  if(deposit<0){err.textContent='L’acconto non può essere negativo.';return}
  if((type==='tattoo'||type==='ritocco')&&!stationId){err.textContent='Seleziona una postazione tattoo.';return}

  let conflict=state.appointments.find(a=>a.status!=='cancelled'&&overlap(startISO,endISO,a.start,a.end)&&((stationId&&a.stationId===stationId)||(artistId&&a.artistId===artistId)));
  if(conflict){err.textContent=`Conflitto con ${clientName(conflict.clientId)} ${fmtTime(conflict.start)}–${fmtTime(conflict.end)}.`;return}

  let appointmentId=uid();
  state.appointments.push({
    id:appointmentId,clientId,artistId:artistId||null,stationId:stationId||null,type,service,
    projectId:projectId||null,start:startISO,end:endISO,status:'confirmed',
    notes:document.getElementById('apNotes').value.trim()
  });

  if(deposit>0){
    state.payments.push({
      id:uid(),clientId,appointmentId,projectId:projectId||null,amount:deposit,
      method:depositMethod,status:'paid',date,type:'deposit',note:'Acconto prenotazione'
    });
  }

  state.audit.push({
    at:new Date().toISOString(),action:'appointment_created',appointmentId,clientId,
    deposit:deposit||0,userId:currentUser().id
  });
  save();closeModal();route.anchor=date;render()
}

    <div class="modal-actions appointment-detail-actions">

function projectQuoteRemaining(clientId,projectId){
  if(!projectId)return null;
  let p=state.projects.find(x=>x.id===projectId&&x.clientId===clientId);
  if(!p)return null;

  let agreed=Number(p.price||0);
  if(!Number.isFinite(agreed)||agreed<=0)return null;

  let paid=state.payments
    .filter(x=>x.clientId===clientId&&x.projectId===projectId&&x.status!=='void')
    .reduce((sum,x)=>sum+Number(x.amount||0),0);

  return Math.max(0,agreed-paid);
}
function openComplete(id){
  if(!isOwner()){
    alert('La chiusura della sessione è riservata esclusivamente al Titolare.');
    return;
  }
  let a=state.appointments.find(x=>x.id===id);
  if(!a||a.status!=='confirmed'){
    alert('Questa sessione non è più chiudibile.');

function saveRestock(itemId){

      input=document.getElementById('rsQty'),
      received=Number(input?.value||0);

    alert('Inserisci una quantità ricevuta valida.');
    return;
  }

  const before=Number(i.qty||0);
  const after=before+received;

  let prev=state.stockCycles.find(c=>c.itemId===itemId&&c.number===i.cycle);
  if(prev)prev.closed='2026-08-24';

  i.cycle=Number(i.cycle||0)+1;
  i.qty=after;

  state.stockCycles=state.stockCycles||[];
  state.inventoryMovements=state.inventoryMovements||[];
  state.audit=state.audit||[];

  state.stockCycles.push({
    id:uid(),itemId,number:i.cycle,opened:'2026-08-24',
    carryOver:before,received,openingQty:after,closed:null
  });
  state.inventoryMovements.push({
    id:uid(),itemId,type:'restock',qty:received,date:'2026-08-24',
    before,after,clientId:null
  });
  state.audit.push({
    at:new Date().toISOString(),action:'inventory_restock',itemId,
    received,before,after,userId:currentUser().id
  });

}

  if(!confirm(`Annullare la transazione di ${fmtMoney(p.amount)}? Rimarrà nello storico come annullata e non sarà conteggiata negli incassi.`))return;

  const before={amount:Number(p.amount||0),method:p.method,status:p.status};
  p.status='void';
  p.voidedAt=new Date().toISOString();

  state.audit.push({
    at:new Date().toISOString(),
    action:'payment_voided',
    paymentId:id,
    clientId:p.clientId,
    appointmentId:p.appointmentId||null,
    before,
    after:{status:'void'},
    userId:currentUser().id
  });

  save();
  if(clientId){
    navigate('client',{clientId});
  }else{
    render();
  }
}

let area51CalendarGesture=null;
let area51CalendarSwipeLockUntil=0;
let area51WheelAccumulator=0;
let area51WheelTimer=null;

function area51CalendarGestureTarget(node){
  if(!(node instanceof Element))return null;
  const viewport=node.closest('.calendar-swipe-viewport');
  if(!viewport)return null;
  if(node.closest('input,select,textarea,button.gweek-event,button.compact-event,.event,.month-ev'))return viewport;
  return viewport;
}
function installCalendarSwipeNavigation(){
  if(window.PointerEvent){
    document.addEventListener('pointerdown',e=>{
      if(area51CalendarAnimating)return;
      const viewport=area51CalendarGestureTarget(e.target);
      if(!viewport)return;
      if(e.pointerType==='mouse'&&e.button!==0)return;
      const track=viewport.querySelector('.calendar-swipe-track');
      if(!track)return;

      area51CalendarGesture={
        viewport,track,pointerId:e.pointerId,
        startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastT:performance.now(),
        dx:0,vx:0,horizontal:false,cancelled:false
      };
    },true);

    document.addEventListener('pointermove',e=>{
      const g=area51CalendarGesture;
      if(!g||g.pointerId!==e.pointerId||g.cancelled)return;

      const dx=e.clientX-g.startX,
            dy=e.clientY-g.startY;

      if(!g.horizontal){
        if(Math.abs(dy)>7&&Math.abs(dy)>Math.abs(dx)*1.08){
          g.cancelled=true;
          return;
        }
        if(Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*1.04){
          g.horizontal=true;
          g.track.classList.add('dragging');
          try{g.viewport.setPointerCapture(e.pointerId)}catch(_){}
        }else return;
      }

      e.preventDefault();
      const now=performance.now(),
            dt=Math.max(1,now-g.lastT);
      g.vx=(e.clientX-g.lastX)/dt;
      g.lastX=e.clientX;
      g.lastT=now;

      const width=Math.max(1,g.viewport.getBoundingClientRect().width),
            max=width*.94;
      g.dx=Math.max(-max,Math.min(max,dx));

      /* Current slide is centered at -width; adjacent week/day/month is already beside it. */
      g.track.style.transform=`translate3d(${-width+g.dx}px,0,0)`;
    },{capture:true,passive:false});

    const finishGesture=e=>{
      const g=area51CalendarGesture;
      if(!g||g.pointerId!==e.pointerId)return;
      area51CalendarGesture=null;

      if(!g.horizontal){
        g.track.classList.remove('dragging');
        return;
      }

      area51CalendarSwipeLockUntil=performance.now()+380;
      const width=Math.max(1,g.viewport.getBoundingClientRect().width),
            threshold=Math.min(72,width*.14),
            commit=Math.abs(g.dx)>threshold||Math.abs(g.vx)>.36;

      if(commit){
        /* Left drag -> next. Right drag -> previous. */
        area51AnimateCalendar(g.dx<0?1:-1,g.dx);
      }else{
        g.track.classList.remove('dragging');
        g.track.classList.add('animating');
        g.track.style.transform=`translate3d(${-width}px,0,0)`;
        setTimeout(()=>g.track.classList.remove('animating'),270);
      }
    };

    document.addEventListener('pointerup',finishGesture,true);
    document.addEventListener('pointercancel',e=>{
      const g=area51CalendarGesture;
      if(!g||g.pointerId!==e.pointerId)return;
      area51CalendarGesture=null;
      const width=Math.max(1,g.viewport.getBoundingClientRect().width);
      g.track.classList.remove('dragging');
      g.track.classList.add('animating');
      g.track.style.transform=`translate3d(${-width}px,0,0)`;
      setTimeout(()=>g.track.classList.remove('animating'),270);
    },true);
  }

  /* Swiping must never accidentally open the slot/day underneath. */
  document.addEventListener('click',e=>{
    if(performance.now()<area51CalendarSwipeLockUntil &&
       e.target instanceof Element &&
       e.target.closest('.calendar-swipe-viewport')){
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  },true);

  /* Horizontal trackpad gesture on desktop/iPad keyboard-trackpad setups. */
  document.addEventListener('wheel',e=>{
    if(area51CalendarAnimating)return;
    const viewport=e.target instanceof Element?e.target.closest('.calendar-swipe-viewport'):null;
    if(!viewport)return;
    if(Math.abs(e.deltaX)<Math.abs(e.deltaY)*1.22||Math.abs(e.deltaX)<4)return;

    e.preventDefault();
    area51WheelAccumulator+=e.deltaX;
    clearTimeout(area51WheelTimer);
    area51WheelTimer=setTimeout(()=>{area51WheelAccumulator=0},130);

    if(Math.abs(area51WheelAccumulator)>66){
      const dir=area51WheelAccumulator>0?1:-1;
      area51WheelAccumulator=0;
      area51AnimateCalendar(dir);
    }
  },{capture:true,passive:false});
}

window.addEventListener('load' ,()=>{installUniversalPressFeedback();installCalendarSwipeNavigation();if(session&&currentUser())showApp();else{document.getElementById('loginScreen').classList.remove('hidden')}document.getElementById('loginPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})});
